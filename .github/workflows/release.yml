name: Publish Local Library Signals

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version/tag. Empty reads LibrarySignals/install.xml."
        required: false
        default: ""
      native_release:
        description: "bliss-guidance-library-signals release tag. Empty uses v0.1.2."
        required: false
        default: ""
      prerelease:
        description: "Mark the GitHub release as prerelease."
        type: boolean
        required: true
        default: false
      dry_run:
        description: "Build packages and upload workflow artifacts only."
        type: boolean
        required: true
        default: false
      update_lms_plugins:
        description: "Update chrober/lms-plugins repo.xml after publishing."
        type: boolean
        required: true
        default: true
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  NATIVE_REPO: chrober/bliss-guidance-library-signals
  PLUGIN_REPO: chrober/lms-plugins

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run provider contract tests
        run: |
          perl tests/provider_descriptor.t
          perl tests/settings_contract.t
          perl tests/plugin_contract.t
      - name: Verify no native executable is committed
        run: |
          set -euo pipefail
          if git ls-files 'LibrarySignals/Bin/*/*' | grep -vE 'LibrarySignals/Bin/SOURCE.md$' | grep -q .; then
            echo "Native binaries must be release-packaged, not source-controlled." >&2
            exit 1
          fi

  package-release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      linux_url: ${{ steps.meta.outputs.linux_url }}
      mac_url: ${{ steps.meta.outputs.mac_url }}
      windows_url: ${{ steps.meta.outputs.windows_url }}
      linux_sha1: ${{ steps.package.outputs.linux_sha1 }}
      mac_sha1: ${{ steps.package.outputs.mac_sha1 }}
      windows_sha1: ${{ steps.package.outputs.windows_sha1 }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive release metadata
        id: meta
        env:
          VERSION_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          NATIVE_RELEASE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.native_release || '' }}
        run: |
          set -euo pipefail
          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then version="${GITHUB_REF_NAME#v}"; else version="$(python -c 'import xml.etree.ElementTree as ET; print(ET.parse("LibrarySignals/install.xml").getroot().findtext("version"))')"; fi
          fi
          install_version="$(python -c 'import xml.etree.ElementTree as ET; print(ET.parse("LibrarySignals/install.xml").getroot().findtext("version"))')"
          test "$version" = "$install_version"
          native_release="${NATIVE_RELEASE_INPUT:-v0.1.2}"
          tag="$version"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "native_release=$native_release"
            echo "linux_url=$base_url/lms-guidance-library-signals-linux-$version.zip"
            echo "mac_url=$base_url/lms-guidance-library-signals-mac-$version.zip"
            echo "windows_url=$base_url/lms-guidance-library-signals-windows-$version.zip"
          } >> "$GITHUB_OUTPUT"
      - name: Download and verify native provider assets
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RELEASE: ${{ steps.meta.outputs.native_release }}
        run: |
          set -euo pipefail
          mkdir native-assets
          gh release download "$NATIVE_RELEASE" --repo "$NATIVE_REPO" --dir native-assets --pattern 'bliss-guidance-library-signals-*'
          (cd native-assets && sha256sum -c *.sha256)
      - name: Build platform plugin archives
        id: package
        run: |
          set -euo pipefail
          version='${{ steps.meta.outputs.version }}'
          mkdir -p dist staging
          install -m 0755 -D native-assets/bliss-guidance-library-signals-aarch64-linux LibrarySignals/Bin/aarch64-linux/bliss-guidance-library-signals
          install -m 0755 -D native-assets/bliss-guidance-library-signals-armhf-linux LibrarySignals/Bin/armhf-linux/bliss-guidance-library-signals
          install -m 0755 -D native-assets/bliss-guidance-library-signals-x86_64-linux LibrarySignals/Bin/x86_64-linux/bliss-guidance-library-signals
          install -m 0755 -D native-assets/bliss-guidance-library-signals-mac LibrarySignals/Bin/mac/bliss-guidance-library-signals
          install -m 0644 -D native-assets/bliss-guidance-library-signals-windows.exe LibrarySignals/Bin/windows/bliss-guidance-library-signals.exe
          package_platform() {
            platform="$1"; asset="$2"; rm -rf staging/LibrarySignals; cp -a LibrarySignals staging/LibrarySignals
            case "$platform" in
              linux) rm -rf staging/LibrarySignals/Bin/mac staging/LibrarySignals/Bin/windows ;;
              mac) rm -rf staging/LibrarySignals/Bin/aarch64-linux staging/LibrarySignals/Bin/armhf-linux staging/LibrarySignals/Bin/x86_64-linux staging/LibrarySignals/Bin/windows ;;
              windows) rm -rf staging/LibrarySignals/Bin/aarch64-linux staging/LibrarySignals/Bin/armhf-linux staging/LibrarySignals/Bin/x86_64-linux staging/LibrarySignals/Bin/mac ;;
            esac
            (cd staging && zip -q -r "../dist/$asset" LibrarySignals)
          }
          package_platform linux "lms-guidance-library-signals-linux-$version.zip"
          package_platform mac "lms-guidance-library-signals-mac-$version.zip"
          package_platform windows "lms-guidance-library-signals-windows-$version.zip"
          for asset in dist/*.zip; do (cd dist && sha1sum "$(basename "$asset")" > "$(basename "$asset").sha1"); (cd dist && sha256sum "$(basename "$asset")" > "$(basename "$asset").sha256"); done
          echo "linux_sha1=$(sha1sum "dist/lms-guidance-library-signals-linux-$version.zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "mac_sha1=$(sha1sum "dist/lms-guidance-library-signals-mac-$version.zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "windows_sha1=$(sha1sum "dist/lms-guidance-library-signals-windows-$version.zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: lms-guidance-library-signals-${{ steps.meta.outputs.version }}
          path: dist/*
      - name: Publish GitHub release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          printf '# Local Library Signals %s\n\nPlatform-specific Lyrion provider packages.\n' "$VERSION" > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" dist/* --clobber; else gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Local Library Signals $VERSION" --notes-file release-notes.md; fi
      - name: Update extension feed
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && (github.event_name != 'workflow_dispatch' || inputs.update_lms_plugins) }}
        uses: actions/checkout@v4
        with:
          repository: chrober/lms-plugins
          path: lms-plugins
          token: ${{ secrets.LMS_PLUGINS_TOKEN || secrets.MS_PLUGINS_TOKEN }}
      - name: Write and publish extension feed entry
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && (github.event_name != 'workflow_dispatch' || inputs.update_lms_plugins) }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          LINUX_URL: ${{ steps.meta.outputs.linux_url }}
          MAC_URL: ${{ steps.meta.outputs.mac_url }}
          WINDOWS_URL: ${{ steps.meta.outputs.windows_url }}
          LINUX_SHA: ${{ steps.package.outputs.linux_sha1 }}
          MAC_SHA: ${{ steps.package.outputs.mac_sha1 }}
          WINDOWS_SHA: ${{ steps.package.outputs.windows_sha1 }}
        run: |
          set -euo pipefail
          python scripts/update_lms_plugins_repo.py --repo-xml lms-plugins/repo.xml --version "$VERSION" --linux-url "$LINUX_URL" --linux-sha "$LINUX_SHA" --mac-url "$MAC_URL" --mac-sha "$MAC_SHA" --windows-url "$WINDOWS_URL" --windows-sha "$WINDOWS_SHA"
          python -c "import xml.etree.ElementTree as ET; ET.parse('lms-plugins/repo.xml')"
          cd lms-plugins
          if ! git diff --quiet -- repo.xml; then git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add repo.xml; git commit -m "Publish Local Library Signals $VERSION"; git push; fi
